<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #111;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .add-form-row {
      display: flex;
      gap: 0.5rem;
    }

    .add-form input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .add-form input:focus {
      outline: 2px solid #4f46e5;
      border-color: transparent;
    }

    .add-form input#tagInput {
      font-size: 0.875rem;
      color: #555;
    }

    .add-form button {
      padding: 0.6rem 1.2rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-form button:hover { background: #4338ca; }

    /* Filter bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      min-height: 0;
    }

    .filter-bar:empty { margin-bottom: 0; }

    .filter-chip {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1.5px solid #4f46e5;
      background: transparent;
      color: #4f46e5;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .filter-chip.active {
      background: #4f46e5;
      color: #fff;
    }

    .filter-chip:hover:not(.active) { background: #eef2ff; }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .item input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
      accent-color: #4f46e5;
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .item-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .item-text {
      font-size: 1rem;
      color: #222;
    }

    .item.done .item-text {
      text-decoration: line-through;
      color: #999;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .tag {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
    }

    .tag:hover { background: #e0e7ff; }

    .item > button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }

    .item > button:hover { color: #ef4444; }

    .empty {
      text-align: center;
      color: #aaa;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Todo</h1>
    <form class="add-form" id="addForm">
      <div class="add-form-row">
        <input type="text" id="input" placeholder="Add a task…" autocomplete="off" />
        <button type="submit">Add</button>
      </div>
      <input type="text" id="tagInput" placeholder="Tags (comma-separated, optional)" autocomplete="off" />
    </form>
    <div class="filter-bar" id="filterBar"></div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>No tasks yet.</p>
  </div>

  <script>
    const form = document.getElementById('addForm');
    const input = document.getElementById('input');
    const tagInput = document.getElementById('tagInput');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const filterBar = document.getElementById('filterBar');

    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    // Migrate old todos that lack a tags field
    todos = todos.map(t => ({ tags: [], ...t }));

    let activeFilter = null;

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function parseTags(raw) {
      return raw.split(',')
        .map(t => t.trim().toLowerCase())
        .filter(t => t.length > 0);
    }

    function allTags() {
      const set = new Set();
      todos.forEach(t => t.tags.forEach(tag => set.add(tag)));
      return [...set].sort();
    }

    function renderFilterBar() {
      const tags = allTags();
      filterBar.innerHTML = '';
      if (tags.length === 0) return;

      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-chip' + (activeFilter === tag ? ' active' : '');
        btn.textContent = tag;
        btn.addEventListener('click', () => {
          activeFilter = activeFilter === tag ? null : tag;
          renderFilterBar();
          renderList();
        });
        filterBar.append(btn);
      });
    }

    function renderList() {
      list.innerHTML = '';
      const visible = activeFilter
        ? todos.filter(t => t.tags.includes(activeFilter))
        : todos;

      empty.hidden = visible.length > 0;

      visible.forEach((todo) => {
        const i = todos.indexOf(todo);
        const li = document.createElement('li');
        li.className = 'item' + (todo.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todos[i].done = checkbox.checked;
          save();
          renderList();
        });

        const body = document.createElement('div');
        body.className = 'item-body';

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = todo.text;

        body.append(span);

        if (todo.tags.length > 0) {
          const tagsDiv = document.createElement('div');
          tagsDiv.className = 'item-tags';
          todo.tags.forEach(tag => {
            const pill = document.createElement('span');
            pill.className = 'tag';
            pill.textContent = tag;
            pill.title = `Filter by "${tag}"`;
            pill.addEventListener('click', () => {
              activeFilter = activeFilter === tag ? null : tag;
              renderFilterBar();
              renderList();
            });
            tagsDiv.append(pill);
          });
          body.append(tagsDiv);
        }

        const del = document.createElement('button');
        del.textContent = '×';
        del.setAttribute('aria-label', 'Delete');
        del.addEventListener('click', () => {
          todos.splice(i, 1);
          if (activeFilter && !allTags().includes(activeFilter)) {
            activeFilter = null;
          }
          save();
          renderFilterBar();
          renderList();
        });

        li.append(checkbox, body, del);
        list.append(li);
      });
    }

    function render() {
      renderFilterBar();
      renderList();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const tags = parseTags(tagInput.value);
      todos.push({ text, done: false, tags });
      input.value = '';
      tagInput.value = '';
      save();
      render();
    });

    render();
  </script>
</body>
</html>
